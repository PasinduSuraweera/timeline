name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the versions setup-python builds for the current Ubuntu runner (3.9 is no longer one of them)
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v
      - name: Render one of each theme
        run: |
          for t in ember ice matrix grape rose gold mono daylight paper; do
            python cli.py --user octocat --theme "$t" --out "/tmp/$t.svg"
          done

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the page script
        run: node tests/app.test.js
