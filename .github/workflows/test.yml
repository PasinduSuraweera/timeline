name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v
      - name: Render one of each theme
        run: |
          for t in ember ice matrix grape rose gold mono daylight paper; do
            python cli.py --user octocat --theme "$t" --out "/tmp/$t.svg"
          done
